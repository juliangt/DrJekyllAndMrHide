# CI: tests + build de tipos/producción. Solo se ejecuta manualmente
# (pestaña Actions → CI → Run workflow).
name: CI

on:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests (Vitest)
        run: npm test

      - name: Build (tsc + Vite)
        run: npm run build
